# 저널 큐레이션 기반 카테고리.
# 두 대분류(신경학·재활의학) 아래 하위 분류를 두고, 각 하위 분류는
# PubMed 저널 약어(NLM title abbreviation) 목록으로 정의한다.
#
# topic_filter: true 인 하위 분류는 아래 공통 주제 필터를 AND로 걸어
#   대형 종합지(Neurology, Brain 등)나 광범위 저널(물리치료·정형)에서
#   사이트가 다루는 재활 관련 주제만 추린다.
# topic_filter: false 는 저널 자체가 곧 주제인 전문지 → 전체 게재분 수집.
#
# 저널 약어가 맞는지는  python -m src.pipeline verify-journals  로 건수 확인 가능.

# 사이트가 다루는 재활/신경 회복 도메인. topic_filter:true 하위 분류에만 적용.
topic_filter: >-
  ("Rehabilitation"[Mesh] OR rehabilitation[tiab] OR rehabilitation[sh]
   OR "physical therapy"[tiab] OR physiotherapy[tiab] OR "occupational therapy"[tiab]
   OR "motor recovery"[tiab] OR "functional recovery"[tiab] OR "gait training"[tiab]
   OR stroke[tiab] OR "cerebral infarction"[tiab] OR "intracerebral hemorrhage"[tiab]
      OR hemiplegia[tiab] OR hemiparesis[tiab] OR "Stroke Rehabilitation"[Mesh]
   OR "traumatic brain injury"[tiab] OR TBI[tiab] OR "brain injury"[tiab] OR concussion[tiab]
   OR "spinal cord injury"[tiab] OR paraplegia[tiab] OR tetraplegia[tiab] OR quadriplegia[tiab]
   OR "hip fracture"[tiab] OR "hip arthroplasty"[tiab] OR "hip replacement"[tiab]
      OR "knee arthroplasty"[tiab] OR "knee replacement"[tiab] OR arthroplasty[tiab]
   OR dysphagia[tiab] OR deglutition[tiab] OR swallowing[tiab])

# export 단계 키워드 필터 (제목 또는 MeSH 용어 기준, 대소문자 무시·부분일치).
#   require_all: 전부 포함돼야 함 (rehabilitation 필수)
#   require_any: 하나 이상 포함돼야 함 (질환 키워드)
# 즉 'rehabilitation' + (아래 질환 중 하나) 를 모두 만족해야 노출된다.
# 수집(backfill)과 무관하게  python -m src.pipeline export  만 다시 돌리면 즉시 반영.
keyword_filter:
  require_all:
    - rehabilitation
  require_any:
    - stroke
    - traumatic brain inj        # traumatic brain injury / injuries
    - brain injuries, traumatic  # MeSH 표기(Brain Injuries, Traumatic)
    - spinal cord inj            # spinal cord injury / injuries
    - parkinson
    - dementia
    - dysphagia
    - deglutition                # 연하장애 MeSH(Deglutition Disorders)
    - arthroplasty

groups:
  - id: neurology
    name_ko: 신경학
    subcategories:
      - id: neuro-general
        name_ko: 최상위 종합
        name_en: Top general neurology
        topic_filter: true          # 종합 신경학지 → 재활 주제만
        journals:
          - {name: The Lancet Neurology, ta: Lancet Neurol}
          - {name: JAMA Neurology, ta: JAMA Neurol}
          - {name: Neurology, ta: Neurology}
          - {name: Annals of Neurology, ta: Ann Neurol}
          - {name: Brain, ta: Brain}
          - {name: J Neurology Neurosurgery Psychiatry, ta: J Neurol Neurosurg Psychiatry}

      - id: neuro-stroke
        name_ko: 뇌졸중 특화
        name_en: Stroke
        topic_filter: false
        journals:
          - {name: Stroke, ta: Stroke}
          - {name: International Journal of Stroke, ta: Int J Stroke}
          - {name: European Stroke Journal, ta: Eur Stroke J}
          - {name: Journal of Stroke, ta: J Stroke}
          - {name: J NeuroInterventional Surgery, ta: J Neurointerv Surg}
          - {name: Neurocritical Care, ta: Neurocrit Care}

      - id: neuro-tbi
        name_ko: 외상성 뇌손상
        name_en: TBI
        topic_filter: false
        journals:
          - {name: Brain Injury, ta: Brain Inj}
          - {name: Journal of Neurotrauma, ta: J Neurotrauma}

      - id: neuro-review
        name_ko: 리뷰
        name_en: Reviews
        topic_filter: true          # 전 질환 리뷰지 → 재활 주제만
        journals:
          - {name: Nature Reviews Neurology, ta: Nat Rev Neurol}
          - {name: Nature Reviews Disease Primers, ta: Nat Rev Dis Primers}

  - id: rehab
    name_ko: 재활의학
    subcategories:
      - id: rehab-general
        name_ko: 종합
        name_en: General rehabilitation
        topic_filter: false
        journals:
          - {name: Archives of Physical Medicine and Rehabilitation, ta: Arch Phys Med Rehabil}
          - {name: Clinical Rehabilitation, ta: Clin Rehabil}
          - {name: Journal of NeuroEngineering and Rehabilitation, ta: J Neuroeng Rehabil}
          - {name: Annals of Physical and Rehabilitation Medicine, ta: Ann Phys Rehabil Med}
          - {name: American Journal of Physical Medicine and Rehabilitation, ta: Am J Phys Med Rehabil}
          - {name: Journal of Rehabilitation Medicine, ta: J Rehabil Med}

      - id: rehab-stroke
        name_ko: 뇌졸중
        name_en: Stroke rehabilitation
        topic_filter: false
        journals:
          - {name: Neurorehabilitation and Neural Repair, ta: Neurorehabil Neural Repair}
          - {name: Stroke, ta: Stroke}
          - {name: International Journal of Stroke, ta: Int J Stroke}
          - {name: Journal of Stroke, ta: J Stroke}

      - id: rehab-tbi
        name_ko: 외상성 뇌손상
        name_en: TBI rehabilitation
        topic_filter: false
        journals:
          - {name: Journal of Head Trauma Rehabilitation, ta: J Head Trauma Rehabil}
          - {name: Brain Injury, ta: Brain Inj}

      - id: rehab-sci
        name_ko: 척수손상
        name_en: SCI rehabilitation
        topic_filter: false
        journals:
          - {name: Spinal Cord, ta: Spinal Cord}
          - {name: Journal of Spinal Cord Medicine, ta: J Spinal Cord Med}
          - {name: Topics in Spinal Cord Injury Rehabilitation, ta: Top Spinal Cord Inj Rehabil}

      - id: rehab-dysphagia
        name_ko: 연하장애
        name_en: Dysphagia
        topic_filter: false
        journals:
          - {name: Dysphagia, ta: Dysphagia}

      - id: rehab-ortho
        name_ko: 고관절·슬관절
        name_en: Hip / knee
        topic_filter: true          # 광범위 정형지 → 고관절·슬관절 주제만
        journals:
          - {name: J Orthopaedic and Sports Physical Therapy, ta: J Orthop Sports Phys Ther}
          - {name: Osteoporosis International, ta: Osteoporos Int}
          - {name: Journal of Arthroplasty, ta: J Arthroplasty}
          - {name: Bone and Joint Journal, ta: Bone Joint J}

      - id: rehab-pt
        name_ko: 물리치료
        name_en: Physiotherapy
        topic_filter: true          # 광범위 물리치료지 → 재활 도메인만
        journals:
          - {name: Physical Therapy, ta: Phys Ther}
          - {name: Journal of Physiotherapy, ta: J Physiother}
          - {name: Physiotherapy, ta: Physiotherapy}
