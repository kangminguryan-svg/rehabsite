pubmed:
  # NCBI 요구사항: tool/email 명시. API key 있으면 초당 10req까지 허용(없으면 3req).
  tool: rehab-papers
  email: kangmingu.ryan@gmail.com
  api_key_env: NCBI_API_KEY
  min_year: 2010    # 이 해부터 연도별로 나눠 수집(연 단위 청크로 1만 상한 회피)
  # 언어·초록 필터는 코드에서 자동 AND. 연도는 backfill 시 연 단위로 처리.
  # 논문 타입 제한이 필요하면 여기에 추가. 지금은 전체(열어둠).
  # 예: [Randomized Controlled Trial, Meta-Analysis, Systematic Review]
  publication_types: []
  retmax: 9999      # esearch 1회 상한(연 단위라 실제로는 훨씬 적음)

# 품질 필터는 저널 큐레이션(categories.yaml)으로 대체됨.
# OpenAlex 지표(IF 프록시)는 현재 수집·필터에 사용하지 않는다.
# (metrics.py 는 향후 지표 표기가 필요할 때를 위해 남겨둠)

fable:
  # 기본 off. 켜면 초록 기반 요약/태그가 붙음.
  enabled: false
  model: claude-fable-5
  api_key_env: ANTHROPIC_API_KEY
  max_per_run: 50

storage:
  db_path: data/papers.db
  export_dir: web/data
