<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재활의학 · 신경학 논문 인덱스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16202B; --paper:#F7F8F6; --card:#FFFFFF;
    --signal:#0E7C6B; --muted:#6B7683; --rule:#DDE1DD;
    --serif:"Newsreader",Georgia,serif;
    --sans:"IBM Plex Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font:400 15px/1.6 var(--sans);
       -webkit-font-smoothing:antialiased}
  a{color:inherit}

  .masthead{border-bottom:1px solid var(--rule);padding:28px 24px 20px;
            display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
  .masthead h1{font:500 26px/1.1 var(--serif);letter-spacing:-.01em}
  .masthead p{color:var(--muted);font-size:13px;margin-top:6px;max-width:56ch}
  .stamp{font:400 11px/1.5 var(--mono);color:var(--muted);text-align:right;white-space:nowrap}

  .shell{display:grid;grid-template-columns:240px 1fr;gap:36px;
         max-width:1120px;margin:0 auto;padding:28px 24px 80px}

  /* 2단계 카테고리 레일 */
  .rail{position:sticky;top:24px;align-self:start}
  .group{margin-bottom:20px}
  .group > h2{font:500 12px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;
    color:var(--muted);padding:0 12px 8px;border-bottom:1px solid var(--rule);margin-bottom:4px}
  .rail button{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
    width:100%;text-align:left;background:none;border:0;border-left:2px solid var(--rule);
    padding:8px 12px;cursor:pointer;font:400 14px/1.35 var(--sans);color:var(--muted);
    transition:color .15s,border-color .15s}
  .rail button:hover{color:var(--ink)}
  .rail button[aria-current="true"]{color:var(--ink);border-left-color:var(--signal);font-weight:500}
  .rail .n{font:400 11px/1 var(--mono);color:var(--muted)}
  .rail :focus-visible{outline:2px solid var(--signal);outline-offset:2px}

  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
  .toolbar input,.toolbar select{font:400 13px var(--sans);color:var(--ink);
    background:var(--card);border:1px solid var(--rule);border-radius:3px;padding:7px 10px}
  .toolbar input{flex:1;min-width:180px}
  .toolbar input:focus,.toolbar select:focus{outline:2px solid var(--signal);outline-offset:1px}
  .refresh{font:400 13px var(--sans);color:var(--signal);background:var(--card);
    border:1px solid var(--rule);border-radius:3px;padding:7px 12px;cursor:pointer;white-space:nowrap}
  .refresh:hover:not(:disabled){border-color:var(--signal)}
  .refresh:disabled{color:var(--muted);cursor:default}
  .refresh:focus-visible{outline:2px solid var(--signal);outline-offset:1px}
  .count{font:400 11px var(--mono);color:var(--muted);margin-left:auto}
  .crumb{font:400 12px var(--mono);color:var(--muted);margin-bottom:18px}
  .crumb b{color:var(--ink);font-weight:500}

  /* 논문 항목 */
  .item{display:grid;grid-template-columns:88px 1fr;gap:18px;
        padding:20px 0;border-top:1px solid var(--rule)}
  .side{font:400 11px/1.5 var(--mono);color:var(--muted);padding-top:3px}
  .side .yr{color:var(--ink);font-weight:500;display:block;font-size:13px;margin-bottom:3px}
  .item h3{font:400 17px/1.4 var(--serif);letter-spacing:-.005em;margin-bottom:6px}
  .item h3 a:hover{text-decoration:underline;text-decoration-color:var(--signal)}
  .meta{font-size:12.5px;color:var(--muted)}
  .meta em{font-style:italic;color:var(--ink)}
  details{margin-top:10px}
  summary{font:400 12px var(--mono);color:var(--signal);cursor:pointer;width:max-content}
  summary:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .abs-tabs{display:flex;gap:6px;margin-top:10px}
  .abs-tabs button{font:400 11px var(--mono);color:var(--muted);background:none;
    border:1px solid var(--rule);border-radius:2px;padding:4px 8px;cursor:pointer}
  .abs-tabs button[aria-pressed="true"]{color:var(--signal);border-color:var(--signal)}
  .abs-tabs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
  .abs{font-size:14px;line-height:1.75;color:#33404E;margin-top:8px;
       white-space:pre-wrap;max-width:68ch;border-left:2px solid var(--rule);padding-left:14px}
  .abs.pending{color:var(--muted)}

  .empty{padding:56px 0;color:var(--muted);font-size:14px}
  .empty code{font:400 12px var(--mono);background:#EDEFEC;padding:2px 5px;border-radius:2px}

  @media (max-width:760px){
    .shell{grid-template-columns:1fr;gap:20px;padding-top:20px}
    .rail{position:static}
    .group{margin-bottom:14px}
    .rail button{border-left:0;border-bottom:1px solid transparent;padding:9px 6px}
    .rail button[aria-current="true"]{border-bottom-color:var(--signal)}
    .item{grid-template-columns:1fr;gap:6px}
    .side{display:flex;align-items:baseline;gap:10px}
    .side .yr{margin-bottom:0}
  }
</style>
</head>
<body>
<header class="masthead">
  <div>
    <h1>재활의학 · 신경학 논문 인덱스</h1>
    <p>엄선한 신경학·재활의학 저널의 2022년 이후 논문을 분야별로 모읍니다. 초록은 클릭 시 한글로 번역해 보여줍니다.</p>
  </div>
  <div class="stamp" id="stamp"></div>
</header>

<main class="shell">
  <nav class="rail" id="rail" aria-label="분야"></nav>
  <section>
    <div class="toolbar">
      <input id="q" type="search" placeholder="제목 · 저널 · 저자 검색" aria-label="검색">
      <select id="sort" aria-label="정렬">
        <option value="year">최신순</option>
        <option value="journal">저널순</option>
      </select>
      <button id="refresh" class="refresh" type="button" title="최신 데이터로 갱신">↻ 갱신</button>
      <span class="count" id="count"></span>
    </div>
    <p class="crumb" id="crumb"></p>
    <div id="list"></div>
  </section>
</main>

<script>
const state = { groups: [], active: null, activeLabel: "", papers: [], q: "", sort: "year", cacheBust: "" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]));
// 갱신 시 캐시 우회용. 평소엔 "" 라 일반 캐시 사용.
const u = p => p + (state.cacheBust || "");
const noStore = () => state.cacheBust ? { cache: "no-store" } : {};

async function boot() {
  let idx;
  try {
    idx = await (await fetch(u("data/index.json"), noStore())).json();
  } catch {
    document.getElementById("list").innerHTML =
      `<p class="empty">데이터가 아직 없습니다. <code>python -m src.pipeline backfill</code> 을 실행하면 이 자리에 논문이 채워집니다.</p>`;
    return;
  }
  state.groups = idx.groups;
  document.getElementById("stamp").textContent =
    `총 ${idx.total ?? 0}편\n갱신 ${new Date(idx.updatedAt).toLocaleString("ko-KR")}`;
  drawRail();
  // 첫 번째 비어있지 않은 하위 분류를 기본 선택(없으면 맨 첫 항목)
  const flat = state.groups.flatMap(g => g.subcategories.map(sc => ({ g, sc })));
  const first = flat.find(x => x.sc.count > 0) || flat[0];
  if (first) select(first.g, first.sc);
}

function drawRail() {
  document.getElementById("rail").innerHTML = state.groups.map(g =>
    `<div class="group"><h2>${esc(g.nameKo)}</h2>` +
    g.subcategories.map(sc =>
      `<button data-id="${sc.id}" aria-current="${sc.id === state.active}">
         <span>${esc(sc.nameKo)}</span><span class="n">${sc.count}</span></button>`).join("") +
    `</div>`).join("");
  document.querySelectorAll("#rail button").forEach(b =>
    b.onclick = () => {
      for (const g of state.groups) {
        const sc = g.subcategories.find(s => s.id === b.dataset.id);
        if (sc) return select(g, sc);
      }
    });
}

async function select(group, sc) {
  state.active = sc.id;
  state.activeLabel = `${group.nameKo} · ${sc.nameKo}`;
  drawRail();
  state.papers = await (await fetch(u(`data/${sc.id}.json`), noStore())).json();
  render();
}

async function refresh() {
  const btn = document.getElementById("refresh");
  btn.disabled = true; btn.textContent = "갱신 중…";
  state.cacheBust = "?t=" + Date.now();   // 저장소의 최신 데이터를 캐시 무시하고 다시 불러옴
  try {
    const idx = await (await fetch(u("data/index.json"), noStore())).json();
    state.groups = idx.groups;
    document.getElementById("stamp").textContent =
      `총 ${idx.total ?? 0}편\n갱신 ${new Date(idx.updatedAt).toLocaleString("ko-KR")}`;
    // 현재 보던 분류를 유지(사라졌으면 비어있지 않은 첫 분류)
    let sel = null;
    for (const g of state.groups) {
      const sc = g.subcategories.find(s => s.id === state.active);
      if (sc) { sel = { g, sc }; break; }
    }
    if (!sel) {
      const flat = state.groups.flatMap(g => g.subcategories.map(sc => ({ g, sc })));
      sel = flat.find(x => x.sc.count > 0) || flat[0];
    }
    drawRail();
    if (sel) await select(sel.g, sel.sc);
    btn.textContent = "갱신됨 ✓";
  } catch {
    btn.textContent = "갱신 실패";
  }
  state.cacheBust = "";
  setTimeout(() => { btn.textContent = "↻ 갱신"; btn.disabled = false; }, 1600);
}

function render() {
  const q = state.q.toLowerCase();
  let rows = state.papers.filter(p => !q ||
    (p.title + " " + (p.journal || "") + " " + (p.authors || []).join(" ")).toLowerCase().includes(q));
  const sorters = {
    journal: (a, b) => (a.journal || "").localeCompare(b.journal || "") || (b.year ?? 0) - (a.year ?? 0),
    year: (a, b) => (b.year ?? 0) - (a.year ?? 0),
  };
  rows.sort(sorters[state.sort] || sorters.year);

  document.getElementById("crumb").innerHTML = `<b>${esc(state.activeLabel)}</b>`;
  document.getElementById("count").textContent = `${rows.length}편`;
  document.getElementById("list").innerHTML = rows.length ? rows.map(card).join("")
    : `<p class="empty">조건에 맞는 논문이 없습니다.</p>`;
}

function card(p) {
  const authors = p.authors?.length
    ? esc(p.authors[0]) + (p.authors.length > 1 ? ` 외 ${p.authors.length - 1}인` : "") : "";
  return `<article class="item">
    <div class="side">
      <span class="yr">${p.year ?? "—"}</span>
      <span>PMID ${p.pmid}</span>
    </div>
    <div>
      <h3><a href="https://pubmed.ncbi.nlm.nih.gov/${p.pmid}/" target="_blank" rel="noopener">${esc(p.title)}</a></h3>
      <p class="meta"><em>${esc(p.journal || "")}</em>${authors ? " · " + authors : ""}</p>
      ${p.abstract ? `<details data-pmid="${p.pmid}"><summary>초록 보기</summary>
        <div class="abs-tabs" role="group" aria-label="초록 언어">
          <button data-view="ko" aria-pressed="true">한글 번역</button>
          <button data-view="en" aria-pressed="false">원문</button>
        </div>
        <p class="abs abs-ko pending">초록을 열면 번역합니다…</p>
        <p class="abs abs-en" hidden>${esc(p.abstract)}</p></details>` : ""}
    </div>
  </article>`;
}

/* ---------- 초록 한글 번역 ---------- */
// 비공식 Google 번역 엔드포인트(무키). 실패하면 원문 + 외부 번역 링크로 폴백.
const trMem = new Map();

async function translate(text, pmid) {
  const key = "tr:" + pmid;
  if (trMem.has(key)) return trMem.get(key);
  try { const c = localStorage.getItem(key); if (c) { trMem.set(key, c); return c; } } catch {}
  const paras = [];
  for (const para of text.split("\n")) {
    paras.push(para.trim() ? await trChunked(para) : "");
  }
  const ko = paras.join("\n");
  trMem.set(key, ko);
  try { localStorage.setItem(key, ko); } catch {}
  return ko;
}

async function trChunked(t) {
  // 문장 경계 기준 1500자 이하 조각으로 나눠 순차 요청 (URL 길이 제한 회피)
  const pieces = [];
  let rest = t;
  while (rest.length > 1500) {
    let cut = rest.lastIndexOf(". ", 1500);
    if (cut < 200) cut = 1500;
    pieces.push(rest.slice(0, cut + 1));
    rest = rest.slice(cut + 1).trimStart();
  }
  pieces.push(rest);
  let out = "";
  for (const piece of pieces) {
    const u = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q="
            + encodeURIComponent(piece);
    const r = await fetch(u, { signal: AbortSignal.timeout(10000) });
    if (!r.ok) throw new Error("translate " + r.status);
    const j = await r.json();
    out += (j[0] || []).map(s => s?.[0] ?? "").join("");
  }
  return out;
}

const listEl = document.getElementById("list");

// details의 toggle은 버블링하지 않으므로 캡처 단계에서 위임
listEl.addEventListener("toggle", async e => {
  const d = e.target;
  if (!(d instanceof HTMLDetailsElement) || !d.open || d.dataset.trDone) return;
  const p = state.papers.find(x => String(x.pmid) === d.dataset.pmid);
  const koEl = d.querySelector(".abs-ko");
  if (!p?.abstract || !koEl) return;
  koEl.textContent = "번역 중…";
  try {
    koEl.textContent = await translate(p.abstract, p.pmid);
    koEl.classList.remove("pending");
    d.dataset.trDone = "1";
  } catch {
    setAbsView(d, "en");
    koEl.innerHTML = `번역 서비스에 연결하지 못했습니다. 다시 열면 재시도합니다. `
      + `<a href="https://translate.google.com/?sl=en&tl=ko&text=${encodeURIComponent(p.abstract.slice(0, 3000))}"`
      + ` target="_blank" rel="noopener">Google 번역에서 열기 ↗</a>`;
  }
}, true);

function setAbsView(d, view) {
  d.querySelector(".abs-ko").hidden = view !== "ko";
  d.querySelector(".abs-en").hidden = view !== "en";
  d.querySelectorAll(".abs-tabs button").forEach(b =>
    b.setAttribute("aria-pressed", String(b.dataset.view === view)));
}

listEl.addEventListener("click", e => {
  const b = e.target.closest(".abs-tabs button");
  if (b) setAbsView(b.closest("details"), b.dataset.view);
});

document.getElementById("q").oninput = e => { state.q = e.target.value; render(); };
document.getElementById("sort").onchange = e => { state.sort = e.target.value; render(); };
document.getElementById("refresh").onclick = refresh;
boot();
</script>
</body>
</html>
